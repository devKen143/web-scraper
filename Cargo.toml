[package]
name = "web-scraper"
version = "0.1.0"
edition = "2021"
description = "A polite, concurrent web crawler and CSS-selector scraper"
license = "MIT"

[[bin]]
name = "scrape"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
scraper = "0.20"
url = "2"
serde_json = "1"
